<!doctype html>
<html lang="en" data-build="20261116164359">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Kakkad Family</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Kakkad family">
  <!-- Link previews (WhatsApp etc.). The build fills these in from family.yaml; they are the only readable text. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Kakkad Family">
  <meta property="og:description" content="Kakkad family">
  <meta property="og:url" content="https://kandarpkakkad.github.io/family-tree/">
  <meta property="og:image" content="https://kandarpkakkad.github.io/family-tree/preview.png?v=20261116164359">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css?v=20261116164359">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11" class="mark-bg"/>
        <path class="mark-line" d="M20 15v6M11 27v-6h18v6"/>
        <circle class="mark-dot" cx="20" cy="11" r="4"/>
        <circle class="mark-dot" cx="11" cy="29" r="4"/>
        <circle class="mark-dot" cx="29" cy="29" r="4"/>
      </svg>
      <div class="brand-text">
        <h1 id="title">Family Tree</h1>
        <p id="subtitle"></p>
      </div>
    </div>
    <div class="tools">
      <!-- Shown only after following a married-in person's arrow to their parents' family -->
      <button class="home" id="home" type="button" hidden></button>
      <div class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
        <input id="search" type="search" placeholder="Find a person…" autocomplete="off" spellcheck="false"
               role="combobox" aria-label="Find a person" aria-controls="results" aria-expanded="false" aria-autocomplete="list">
        <ul id="results" class="results" role="listbox" hidden></ul>
      </div>
    </div>
  </header>

  <div id="notice" class="notice" role="status" hidden></div>

  <main id="viewport" class="viewport" aria-label="Family tree. Drag or scroll to move; pinch or Ctrl+scroll to zoom.">
    <div id="world" class="world">
      <svg id="links" class="links" aria-hidden="true"></svg>
      <div id="cards" class="cards"></div>
    </div>
  </main>

  <div id="status" class="status">
    <div class="box"><p>Opening the family tree…</p></div>
  </div>
  <noscript><div class="status error"><div class="box"><h2>JavaScript is off</h2><p>This family tree needs JavaScript to draw.</p></div></div></noscript>

  <!-- Shown to the tree's editor once signed in on this device -->
  <div id="editbar" class="editbar" hidden>
    <span>Editing <b>family.yaml</b></span>
    <button id="signOut" type="button">Sign out</button>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <div class="zoom" role="group" aria-label="View">
    <button id="layout" type="button" title="Show top-down" aria-label="Show top-down">
      <!-- the shape you switch to: top-down tree, or generations left to right -->
      <svg class="to-down" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 5.5v4M5 14.5v-5h10v5"/><circle cx="10" cy="4" r="1.6"/><circle cx="5" cy="16" r="1.6"/><circle cx="15" cy="16" r="1.6"/></svg>
      <svg class="to-across" viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 10h4M14.5 5h-5v10h5"/><circle cx="4" cy="10" r="1.6"/><circle cx="16" cy="5" r="1.6"/><circle cx="16" cy="15" r="1.6"/></svg>
    </button>
    <button id="foldAll" type="button" title="Fold every branch" aria-label="Fold every branch">
      <svg class="to-fold" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3.5l4 4 4-4M6 16.5l4-4 4 4"/></svg>
      <svg class="to-open" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 7.5l4-4 4 4M6 12.5l4 4 4-4"/></svg>
    </button>
    <button id="zoomIn" type="button" title="Zoom in (+)" aria-label="Zoom in">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
    </button>
    <button id="zoomOut" type="button" title="Zoom out (−)" aria-label="Zoom out">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12"/></svg>
    </button>
    <button id="zoomFit" type="button" title="Fit the whole tree (0)" aria-label="Fit the whole tree">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>
    </button>
  </div>

  <aside id="panel" class="panel" aria-labelledby="panelTitle" aria-hidden="true">
    <button id="panelClose" class="panel-close" type="button" aria-label="Close">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
    </button>
    <div id="panelBody"></div>
  </aside>

  <script src="app.js?v=20261116164359"></script>
</body>
</html>
